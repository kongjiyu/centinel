name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from the root package.json `packageManager` field (pnpm 10).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sidecar Dynamic Testing tests drive a real local Chromium.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm --filter @centinel/sidecar exec playwright install chromium

      - name: Build frontend
        run: pnpm --filter centinel build

      - name: Frontend tests
        run: pnpm --filter centinel test

      - name: Sidecar tests
        run: pnpm --filter @centinel/sidecar test
