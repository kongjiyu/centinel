<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sample Shop</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Sample Shop</h1>
    <p id="account-status">Not signed in</p>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="products-heading">
      <h2 id="products-heading">Products</h2>
      <ul id="product-list" class="products"></ul>
    </section>

    <aside class="side">
      <section class="panel" id="signin-panel" aria-labelledby="signin-heading">
        <h2 id="signin-heading">Sign in</h2>
        <form id="signin-form">
          <label>Email <input id="email" name="email" type="email" autocomplete="username" required></label>
          <label>Password <input id="password" name="password" type="password" autocomplete="current-password" required></label>
          <button type="submit">Sign in</button>
          <p id="signin-error" class="error" role="alert"></p>
        </form>
      </section>

      <section class="panel" aria-labelledby="cart-heading">
        <h2 id="cart-heading">Cart</h2>
        <ul id="cart-lines" class="cart"></ul>
        <p class="total">Total: <strong id="cart-total">$0.00</strong></p>
        <label>Discount code <input id="discount-code" name="discount"></label>
        <button id="checkout" type="button">Place order</button>
        <p id="checkout-message" role="status"></p>
      </section>
    </aside>
  </main>

  <script src="/app.js"></script>
</body>
</html>
